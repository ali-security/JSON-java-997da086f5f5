# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  # old-school build and jar method. No tests run or compiled.
  build-1_6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # build for java 1.6, however don't run any tests
        java: [ 1.6 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      # setup-java@v1 can no longer resolve Java 6 from the Azul metadata API; fetch the Zulu 6 tarball directly
      - name: Download Zulu JDK 1.6
        run: curl -fsSL https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz -o "$RUNNER_TEMP/jdk.tar.gz"
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
      - name: Compile Java ${{ matrix.java }}
        run: |
          mkdir -p target/classes
          javac -d target/classes/ src/main/java/org/json/*.java
      - name: Create java ${{ matrix.java }} JAR
        run: |
          jar cvf target/org.json.jar -C target/classes .
      - name: Upload Java ${{ matrix.java }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: Java ${{ matrix.java }} JAR
          path: target/org.json.jar

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        # build against supported Java LTS versions:
        java: [ 8, 11 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
      - name: Compile Java ${{ matrix.java }}
        run: mvn clean compile -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -Dmaven.test.skip=true -Dmaven.site.skip=true -Dmaven.javadoc.skip=true
      - name: Run Tests ${{ matrix.java }}
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn test -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -Dtest=${{ inputs.test-filter }} -DfailIfNoTests=false
          else
            mvn test -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
          fi
      - name: List Skipped Tests ${{ matrix.java }}
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  s = tc.find('skipped')
                  if s is not None:
                      n += 1
                      print('[WARNING] Skipped test: %s#%s -- reason: %s' % (tc.get('classname'), tc.get('name'), s.get('message') or '(none given)'))
          print('Total skipped tests: %d' % n)
          PY
      - name: Build Test Report ${{ matrix.java }}
        if: ${{ always() }}
        run: |
          mvn surefire-report:report-only -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
          mvn site -DgenerateReports=false -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }}
      - name: Upload Test Results ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Results ${{ matrix.java }}
          path: target/surefire-reports/
      - name: Upload Test Report ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Report ${{ matrix.java }}
          path: target/site/
      # the published jar is the maven-bundle-plugin jar built on JDK 8 (Build-Jdk: 1.8.0_271)
      - name: Package Jar ${{ matrix.java }}
        if: ${{ matrix.java == 8 }}
        run: mvn clean package -Dmaven.compiler.source=${{ matrix.java }} -Dmaven.compiler.target=${{ matrix.java }} -Dmaven.test.skip=true -Dmaven.site.skip=true
      - name: Upload Package Jar ${{ matrix.java }}
        if: ${{ matrix.java == 8 }}
        uses: actions/upload-artifact@v4
        with:
          name: Package Jar ${{ matrix.java }}
          path: target/json-*[0-9].jar
          if-no-files-found: error
